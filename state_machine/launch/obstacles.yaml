# 障碍物配置文件
# 此文件定义了用于EgoPlanner和A*规划的障碍物
# 障碍物坐标系统：ENU (East-North-Up)，单位：米

# obstacles:
#   # 长方体障碍物示例
#   - type: box
#     x: 20.0
#     y: 20.
#     z: 8.0
#     width: 2.5
#     length: 2.5
#     height: 5.0

#   - type: box
#     x: 10.0
#     y: 10.0
#     z: 5.0
#     width: 1.0
#     length: 1.3
#     height: 5.0

#   - type: box
#     x: 60.0
#     y: 60.0
#     z: 10.0
#     width: 1.0
#     length: 1.5
#     height: 8.0

  # - type: box
  #   x: 6.0
  #   y: 3.0
  #   z: 1.0
  #   width: 1.0
  #   length: 0.3
  #   height: 4.0

  # - type: box
  #   x: 5.0
  #   y: 5.0
  #   z: 1.0
  #   width: 1.0
  #   length: 0.3
  #   height: 6.0

  # 球形障碍物示例（可选）
  # - type: sphere
  #   x: 4.0
  #   y: 3.0
  #   z: 1.5
  #   radius: 0.5

# 注意事项：
# 1. x, y, z 是障碍物中心位置
# 2. width, length, height 是长方体的尺寸（x, y, z方向）
# 3. radius 是球体的半径
# 4. z轴向上为正
# 5. 这些障碍物应该与 planner/src/planner.cpp 中定义的障碍物保持一致

obstacles:
  # 【场景1：死胡同测试】
  # 无人机从 (0,0,2) 起飞，目标 (15, 0, 2)
  # 在 (8, 0, 2) 放置一个大墙，完全阻挡路径
  # 并且在周围环绕障碍物，让规划器找不到出路
  
  # 中央大墙（完全阻挡）
  - type: box
    x: 8.0
    y: 0.0
    z: 5.5
    width: 6.0   # X方向 6m
    length: 20.0 # Y方向 20m（完全封锁）
    height: 8.0  # Z方向 8m（覆盖飞行高度）
    
  # 左侧墙（防止绕行）
  - type: box
    x: 8.0
    y: -12.0
    z: 5.5
    width: 6.0
    length: 6.0
    height: 8.0
    
  # 右侧墙（防止绕行）
  - type: box
    x: 8.0
    y: 12.0
    z: 5.5
    width: 6.0
    length: 6.0
    height: 8.0